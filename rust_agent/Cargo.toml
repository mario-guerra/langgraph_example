[package]
name = "rust_agent"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.37", features = ["full"] }
rig-core = { version = "0.38.1", features = ["reqwest-middleware"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"
backoff = { version = "0.4", features = ["tokio"] }
anyhow = "1.0"
reqwest = { version = "0.13", features = ["json"] }
reqwest-middleware = "0.5"
orchid-sdk = { path = "../../_orchid/service/tools/sdk-rust/orchid-sdk" }
dotenv = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
rig-vertexai = "0.3.7"

[dev-dependencies]
tokio-test = "0.4"
